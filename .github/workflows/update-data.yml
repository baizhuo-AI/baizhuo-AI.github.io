name: Update pricing data

on:
  push:
    paths:
      - 'data/incoming/*.csv'
      - 'data/incoming/*.tsv'
  pull_request:
    paths:
      - 'data/incoming/*.csv'
      - 'data/incoming/*.tsv'
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Normalize incoming CSV files
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/incoming/*.csv data/incoming/*.tsv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CSV/TSV files found in data/incoming/." >&2
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Normalizing $file"
            tmp_base="$(mktemp)"
            tmp_updates="$(mktemp)"
            if [ -f data/official_pricing.json ]; then
              cp data/official_pricing.json "$tmp_base"
            else
              echo '[]' > "$tmp_base"
            fi
            node data/tools/csv_to_json.mjs "$file"
            cp data/official_pricing.json "$tmp_updates"
            node data/tools/merge_json.mjs "$tmp_base" "$tmp_updates" data/official_pricing.json
            rm -f "$tmp_base" "$tmp_updates"
          done

      - name: Format JSON
        run: npx --yes prettier@3.2.5 --write data/official_pricing.json

      - name: Commit changes
        run: |
          if git diff --quiet data/official_pricing.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official_pricing.json
          git commit -m "chore(data): update official pricing dataset"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
